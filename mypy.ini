[mypy]
allow_redefinition = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true

# Core modules have heavy pandas/jax usage with complex type patterns
# that mypy cannot infer correctly without extensive manual annotations
[mypy-mrpeg.peg]
disable_error_code = arg-type, index, union-attr, call-overload

[mypy-mrpeg.signal]
disable_error_code = arg-type, assignment, return-value, union-attr
